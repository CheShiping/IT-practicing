    <path d="M216 40l2.4 6 6 2.4-6 2.4-2.4 6-2.4-6-6-2.4 6-2.4z" fill="#fdce02" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="228" cy="86" r="3.4" fill="#ffffff" stroke-width="2"/>
